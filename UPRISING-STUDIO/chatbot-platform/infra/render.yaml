services:
  - type: web
    name: chatbot-backend
    env: docker
    dockerfile: apps/backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: chatbot-frontend
    env: docker
    dockerfile: apps/frontend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chatbot-backend.onrender.com/api
      - key: NEXT_PUBLIC_FRONTEND_URL
        value: https://chatbot-frontend.onrender.com

databases:
  - name: chatbot-db
    plan: free
    region: frankfurt
